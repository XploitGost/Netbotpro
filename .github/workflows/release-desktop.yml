name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Target OS to package
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
      publish_release:
        description: Publish a GitHub Release from this run
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Desktop (windows-latest)
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.inputs.target_os == 'windows'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm ci
      - name: Run Windows packaging script
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netbotpro-windows-artifacts
          path: desktop/electron/dist/Netbotpro-*.exe
          if-no-files-found: error

  package-linux:
    name: Package Desktop (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_os == 'linux'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm ci
      - name: Run Linux packaging script
        run: bash packaging/linux/build.sh
      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netbotpro-linux-artifacts
          path: |
            desktop/electron/dist/*.AppImage
            desktop/electron/dist/*.deb
          if-no-files-found: error

  publish-windows:
    name: Publish Windows GitHub Release
    runs-on: ubuntu-latest
    needs: package-windows
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_os == 'windows' && github.event.inputs.publish_release == 'true')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: netbotpro-windows-artifacts
          path: release-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*

  publish-linux:
    name: Publish Linux GitHub Release
    runs-on: ubuntu-latest
    needs: package-linux
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_os == 'linux' && github.event.inputs.publish_release == 'true'
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: netbotpro-linux-artifacts
          path: release-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
