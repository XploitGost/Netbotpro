name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Target OS to package
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
      publish_release:
        description: Publish a GitHub Release from this run
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - input: windows
            os: windows-latest
            package_cmd: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
            artifact_glob: desktop/electron/dist/Netbotpro-*.exe
          - input: linux
            os: ubuntu-latest
            package_cmd: bash packaging/linux/build.sh
            artifact_glob: |
              desktop/electron/dist/*.AppImage
              desktop/electron/dist/*.deb
    if: (github.event_name == 'push' && matrix.input == 'windows') || github.event.inputs.target_os == matrix.input
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm ci
      - name: Run platform packaging script
        run: ${{ matrix.package_cmd }}
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netbotpro-${{ matrix.input }}-artifacts
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/**/*
