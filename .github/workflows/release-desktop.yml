name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Target OS to package
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos

jobs:
  package:
    name: Package Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - input: windows
            os: windows-latest
            package_cmd: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
          - input: linux
            os: ubuntu-latest
            package_cmd: bash packaging/linux/build.sh
          - input: macos
            os: macos-latest
            package_cmd: bash packaging/macos/build.sh
    if: github.event.inputs.target_os == matrix.input
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt PyInstaller
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run platform packaging script
        run: ${{ matrix.package_cmd }}
