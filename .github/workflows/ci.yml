name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit pinned Python requirements
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --disable-pip --strict -r requirements-dev.txt
      - name: Audit all npm lockfiles
        run: |
          npm audit --prefix frontend --package-lock-only --audit-level=low
          npm audit --prefix frontend/desktop-reference --package-lock-only --audit-level=low
          npm audit --prefix desktop/electron --package-lock-only --audit-level=low

  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check tracked source safety
        run: python scripts/qa/repository_hygiene.py

  backend-tests:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Run CI-safe real-load benchmark
        run: python benchmarks/long_soak_runner.py --profile light_desktop --duration-sec 5 --events-per-sec 100 --flows 10 --websocket-clients 1 --sample-interval-sec 0.25 --cpu-budget-basis available-cpus --max-cpu-avg-percent 100 --max-cpu-peak-percent 200 --ci-safe --output .runtime/benchmarks/ci-safe-real-load
      - name: Retain bounded benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-benchmark-${{ matrix.os }}-${{ github.run_attempt }}
          path: .runtime/benchmarks/ci-safe-real-load/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend UI tests
        run: npm run test:ui
      - name: Run preserved desktop model contracts
        run: node --test desktop-reference/dashboardModel.test.mjs desktop-reference/endpointModel.test.mjs desktop-reference/investigateModel.test.mjs desktop-reference/monitorModel.test.mjs desktop-reference/queueModel.test.mjs desktop-reference/trafficModel.test.mjs
      - name: Build frontend
        run: npm run build

  windows-desktop-smoke:
    name: Desktop Smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [repository-hygiene, dependency-audit, backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/electron/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm ci
      - name: Install isolated desktop test harness dependencies
        working-directory: frontend/desktop-reference
        run: npm ci --ignore-scripts
      - name: Validate Electron entrypoints
        working-directory: desktop/electron
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --test backend-shutdown.test.cjs
          node --test ui-entry.test.cjs
          npx electron --version
      - name: Build and stage packaged backend
        run: |
          python -m PyInstaller packaging/pyinstaller/netbotpro_backend.spec --clean --noconfirm
          python scripts/release/stage_backend_runtime.py
      - name: Run packaged backend smoke
        run: python scripts/qa/packaged_backend_smoke.py
      - name: Build standard frontend for runtime smoke
        working-directory: frontend
        run: npm run build
      - name: Test both source entries with synthetic browser transport
        working-directory: frontend/desktop-reference
        run: |
          npx playwright install chromium
          $env:NETBOT_CHROME_PATH = node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())"
          node test-standard-live-follow.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test-source-desktop.mjs
      - name: Run isolated Electron runtime smoke
        working-directory: frontend/desktop-reference
        env:
          NETBOT_SMOKE_BACKEND_DIR: ${{ github.workspace }}/packaging/runtime/backend
        run: node test-electron-runtime.mjs
      - name: Run source-built desktop entry smoke
        working-directory: frontend/desktop-reference
        env:
          NETBOT_SMOKE_BACKEND_DIR: ${{ github.workspace }}/packaging/runtime/backend
          NETBOT_DESKTOP_UI: desktop
        run: node test-electron-runtime.mjs
